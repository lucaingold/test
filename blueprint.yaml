blueprint:
  domain: automation
  name: "Paulmann Gent 2 (501.40) - Zigbee2MQTT"
  description: "Use the Paulmann Gent 2 remote with Zigbee2MQTT in Home Assistant."

  input:
    remote_name:
      name: "Paulmann Gent 2 remote (friendly_name)"
      description: "Enter the Zigbee2MQTT friendly_name of the remote (as configured in Zigbee2MQTT)."
      selector:
        text:

    # Scene 1 inputs
    sc1_power_off:
      name: "⏻ Power - Off"
      selector: { action: {} }
    sc1_power_on:
      name: "⏻ Power - On"
      selector: { action: {} }
    sc1_brightness_lower:
      name: "━ Lower brightness"
      selector: { action: {} }
    sc1_brightness_higher:
      name: "✚ Higher brightness"
      selector: { action: {} }
    sc1_fire:
      name: "🔥 Fire"
      selector: { action: {} }
    sc1_skip:
      name: "⏭️ Skip"
      selector: { action: {} }
    sc1_snow:
      name: "❄️ Snow"
      selector: { action: {} }
    sc1_s1:
      name: "🔘 S1"
      selector: { action: {} }
    sc1_s2:
      name: "🔘 S2"
      selector: { action: {} }
    sc1_s3:
      name: "🔘 S3"
      selector: { action: {} }
    sc1_s4:
      name: "🔘 S4"
      selector: { action: {} }
    sc1_s5:
      name: "🔘 S5"
      selector: { action: {} }
    sc1_s6:
      name: "🔘 S6"
      selector: { action: {} }
    sc1_s7:
      name: "🔘 S7"
      selector: { action: {} }
    sc1_repeat:
      name: "🔄 Repeat"
      selector: { action: {} }
    sc1_color_wheel_button:
      name: "◑ Color wheel - Button"
      selector: { action: {} }

    # Scene 2 inputs (copy of Scene 1, simplified)
    sc2_power_off:
      name: "⏻ Power - Off"
      selector: { action: {} }
    sc2_power_on:
      name: "⏻ Power - On"
      selector: { action: {} }
    sc2_brightness_lower:
      name: "━ Lower brightness"
      selector: { action: {} }
    sc2_brightness_higher:
      name: "✚ Higher brightness"
      selector: { action: {} }
    sc2_s1:
      name: "🔘 S1"
      selector: { action: {} }
    sc2_s7:
      name: "🔘 S7"
      selector: { action: {} }

    # Scene 3 inputs
    sc3_power_off:
      name: "⏻ Power - Off"
      selector: { action: {} }
    sc3_power_on:
      name: "⏻ Power - On"
      selector: { action: {} }
    sc3_s1:
      name: "🔘 S1"
      selector: { action: {} }
    sc3_s7:
      name: "🔘 S7"
      selector: { action: {} }

    # Scene 4 inputs
    sc4_power_off:
      name: "⏻ Power - Off"
      selector: { action: {} }
    sc4_power_on:
      name: "⏻ Power - On"
      selector: { action: {} }
    sc4_s1:
      name: "🔘 S1"
      selector: { action: {} }
    sc4_s7:
      name: "🔘 S7"
      selector: { action: {} }

mode: parallel

trigger:
  - platform: mqtt
    topic: "zigbee2mqtt/+/action"

action:
  - choose:
      # Scene 1
      - conditions:
          - condition: template
            value_template: "{{ trigger.topic.split('/')[-2] == remote_name and trigger.payload == 'off_1' }}"
        sequence:
          - !input sc1_power_off
      - conditions:
          - condition: template
            value_template: "{{ trigger.topic.split('/')[-2] == remote_name and trigger.payload == 'on_1' }}"
        sequence:
          - !input sc1_power_on
      - conditions:
          - condition: template
            value_template: "{{ trigger.topic.split('/')[-2] == remote_name and trigger.payload == 'brightness_step_down_1' }}"
        sequence:
          - !input sc1_brightness_lower
      - conditions:
          - condition: template
            value_template: "{{ trigger.topic.split('/')[-2] == remote_name and trigger.payload == 'brightness_step_up_1' }}"
        sequence:
          - !input sc1_brightness_higher
      - conditions:
          - condition: template
            value_template: "{{ trigger.topic.split('/')[-2] == remote_name and trigger.payload == 'color_temperature_step_down_1' }}"
        sequence:
          - !input sc1_fire
      - conditions:
          - condition: template
            value_template: "{{ trigger.topic.split('/')[-2] == remote_name and trigger.payload == 'color_temperature_step_up_1' }}"
        sequence:
          - !input sc1_skip
      - conditions:
          - condition: template
            value_template: "{{ trigger.topic.split('/')[-2] == remote_name and trigger.payload == 'snow_1' }}"
        sequence:
          - !input sc1_snow
      - conditions:
          - condition: template
            value_template: "{{ trigger.topic.split('/')[-2] == remote_name and trigger.payload == 'recall_1_1' }}"
        sequence:
          - !input sc1_s1
      - conditions:
          - condition: template
            value_template: "{{ trigger.topic.split('/')[-2] == remote_name and trigger.payload == 'recall_2_1' }}"
        sequence:
          - !input sc1_s2
      - conditions:
          - condition: template
            value_template: "{{ trigger.topic.split('/')[-2] == remote_name and trigger.payload == 'recall_3_1' }}"
        sequence:
          - !input sc1_s3
      - conditions:
          - condition: template
            value_template: "{{ trigger.topic.split('/')[-2] == remote_name and trigger.payload == 'recall_4_1' }}"
        sequence:
          - !input sc1_s4
      - conditions:
          - condition: template
            value_template: "{{ trigger.topic.split('/')[-2] == remote_name and trigger.payload == 'recall_5_1' }}"
        sequence:
          - !input sc1_s5
      - conditions:
          - condition: template
            value_template: "{{ trigger.topic.split('/')[-2] == remote_name and trigger.payload == 'recall_6_1' }}"
        sequence:
          - !input sc1_s6
      - conditions:
          - condition: template
            value_template: "{{ trigger.topic.split('/')[-2] == remote_name and trigger.payload == 'recall_7_1' }}"
        sequence:
          - !input sc1_s7
      - conditions:
          - condition: template
            value_template: "{{ trigger.topic.split('/')[-2] == remote_name and trigger.payload == 'repeat_1' }}"
        sequence:
          - !input sc1_repeat
      - conditions:
          - condition: template
            value_template: "{{ trigger.topic.split('/')[-2] == remote_name and trigger.payload == 'color_wheel_1' }}"
        sequence:
          - !input sc1_color_wheel_button

      # Scene 2
      - conditions:
          - condition: template
            value_template: "{{ trigger.topic.split('/')[-2] == remote_name and trigger.payload == 'off_2' }}"
        sequence:
          - !input sc2_power_off
      - conditions:
          - condition: template
            value_template: "{{ trigger.topic.split('/')[-2] == remote_name and trigger.payload == 'on_2' }}"
        sequence:
          - !input sc2_power_on
      - conditions:
          - condition: template
            value_template: "{{ trigger.topic.split('/')[-2] == remote_name and trigger.payload == 'brightness_step_down_2' }}"
        sequence:
          - !input sc2_brightness_lower
      - conditions:
          - condition: template
            value_template: "{{ trigger.topic.split('/')[-2] == remote_name and trigger.payload == 'brightness_step_up_2' }}"
        sequence:
          - !input sc2_brightness_higher
      - conditions:
          - condition: template
            value_template: "{{ trigger.topic.split('/')[-2] == remote_name and trigger.payload == 'recall_1_2' }}"
        sequence:
          - !input sc2_s1
      - conditions:
          - condition: template
            value_template: "{{ trigger.topic.split('/')[-2] == remote_name and trigger.payload == 'recall_7_2' }}"
        sequence:
          - !input sc2_s7

      # Scene 3
      - conditions:
          - condition: template
            value_template: "{{ trigger.topic.split('/')[-2] == remote_name and trigger.payload == 'off_3' }}"
        sequence:
          - !input sc3_power_off
      - conditions:
          - condition: template
            value_template: "{{ trigger.topic.split('/')[-2] == remote_name and trigger.payload == 'on_3' }}"
        sequence:
          - !input sc3_power_on
      - conditions:
          - condition: template
            value_template: "{{ trigger.topic.split('/')[-2] == remote_name and trigger.payload == 'recall_1_3' }}"
        sequence:
          - !input sc3_s1
      - conditions:
          - condition: template
            value_template: "{{ trigger.topic.split('/')[-2] == remote_name and trigger.payload == 'recall_7_3' }}"
        sequence:
          - !input sc3_s7

      # Scene 4
      - conditions:
          - condition: template
            value_template: "{{ trigger.topic.split('/')[-2] == remote_name and trigger.payload == 'off_4' }}"
        sequence:
          - !input sc4_power_off
      - conditions:
          - condition: template
            value_template: "{{ trigger.topic.split('/')[-2] == remote_name and trigger.payload == 'on_4' }}"
        sequence:
          - !input sc4_power_on
      - conditions:
          - condition: template
            value_template: "{{ trigger.topic.split('/')[-2] == remote_name and trigger.payload == 'recall_1_4' }}"
        sequence:
          - !input sc4_s1
      - conditions:
          - condition: template
            value_template: "{{ trigger.topic.split('/')[-2] == remote_name and trigger.payload == 'recall_7_4' }}"
        sequence:
          - !input sc4_s7

    default: []
