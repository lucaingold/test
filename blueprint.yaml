blueprint:
  domain: automation
  name: "Paulmann Gent 2 (501.40) - Zigbee2MQTT"
  description: "Use the Paulmann Gent 2 remote with Zigbee2MQTT in Home Assistant."

  input:
    remote_name:
      name: "Paulmann Gent 2 remote (friendly_name)"
      description: "Enter the Zigbee2MQTT friendly_name of the remote (as configured in Zigbee2MQTT)."
      selector:
        text:

    # Scene 1 inputs
    sc1_power_off:
      name: "⏻ Power - Off"
      selector: { action: {} }
      default: []
    sc1_power_on:
      name: "⏻ Power - On"
      selector: { action: {} }
      default: []
    sc1_brightness_lower:
      name: "━ Lower brightness"
      selector: { action: {} }
      default: []
    sc1_brightness_higher:
      name: "✚ Higher brightness"
      selector: { action: {} }
      default: []
    sc1_fire:
      name: "🔥 Fire"
      selector: { action: {} }
      default: []
    sc1_skip:
      name: "⏭️ Skip"
      selector: { action: {} }
      default: []
    sc1_snow:
      name: "❄️ Snow"
      selector: { action: {} }
      default: []
    sc1_s1:
      name: "🔘 S1"
      selector: { action: {} }
      default: []
    sc1_s2:
      name: "🔘 S2"
      selector: { action: {} }
      default: []
    sc1_s3:
      name: "🔘 S3"
      selector: { action: {} }
      default: []
    sc1_s4:
      name: "🔘 S4"
      selector: { action: {} }
      default: []
    sc1_s5:
      name: "🔘 S5"
      selector: { action: {} }
      default: []
    sc1_s6:
      name: "🔘 S6"
      selector: { action: {} }
      default: []
    sc1_s7:
      name: "🔘 S7"
      selector: { action: {} }
      default: []
    sc1_repeat:
      name: "🔄 Repeat"
      selector: { action: {} }
      default: []
    sc1_color_wheel_button:
      name: "◑ Color wheel - Button"
      selector: { action: {} }
      default: []

mode: parallel

trigger:
  - platform: mqtt
    topic: "zigbee2mqtt/+/action"

action:
  - variables:
      remote: "{{ remote_name | trim | lower }}"
      device: "{{ trigger.topic.split('/')[1] | trim | lower }}"
      action: "{{ trigger.payload_json.action }}"
  - choose:
      - conditions:
          - "{{ device == remote and action == 'off_1' }}"
        sequence: !input sc1_power_off
      - conditions:
          - "{{ device == remote and action == 'on_1' }}"
        sequence: !input sc1_power_on
      - conditions:
          - "{{ device == remote and action == 'brightness_step_down_1' }}"
        sequence: !input sc1_brightness_lower
      - conditions:
          - "{{ device == remote and action == 'brightness_step_up_1' }}"
        sequence: !input sc1_brightness_higher
      - conditions:
          - "{{ device == remote and action == 'color_temperature_step_down_1' }}"
        sequence: !input sc1_fire
      - conditions:
          - "{{ device == remote and action == 'color_temperature_step_up_1' }}"
        sequence: !input sc1_skip
      - conditions:
          - "{{ device == remote and action == 'snow_1' }}"
        sequence: !input sc1_snow
      - conditions:
          - "{{ device == remote and action == 'recall_1_1' }}"
        sequence: !input sc1_s1
      - conditions:
          - "{{ device == remote and action == 'recall_2_1' }}"
        sequence: !input sc1_s2
      - conditions:
          - "{{ device == remote and action == 'recall_3_1' }}"
        sequence: !input sc1_s3
      - conditions:
          - "{{ device == remote and action == 'recall_4_1' }}"
        sequence: !input sc1_s4
      - conditions:
          - "{{ device == remote and action == 'recall_5_1' }}"
        sequence: !input sc1_s5
      - conditions:
          - "{{ device == remote and action == 'recall_6_1' }}"
        sequence: !input sc1_s6
      - conditions:
          - "{{ device == remote and action == 'recall_7_1' }}"
        sequence: !input sc1_s7
      - conditions:
          - "{{ device == remote and action == 'repeat_1' }}"
        sequence: !input sc1_repeat
      - conditions:
          - "{{ device == remote and action == 'color_wheel_1' }}"
        sequence: !input sc1_color_wheel_button
  - default: []
